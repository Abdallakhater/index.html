<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyFlow - Money Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #102a43;
            --navy-light: #243b53;
            --white: #ffffff;
            --background: #f5f7fa;
            --border: #d9e2ec;
            --text: #102a43;
            --muted: #627d98;
            --green: #16875d;
            --red: #d64545;
            --shadow: 0 10px 30px rgba(16, 42, 67, 0.08);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: var(--navy);
            color: white;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            padding: 0 12px 35px;
            letter-spacing: -0.5px;
        }

        .logo span {
            opacity: 0.65;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav button {
            border: none;
            background: transparent;
            color: #d9e2ec;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav button:hover,
        .nav button.active {
            background: white;
            color: var(--navy);
        }

        .sidebar-bottom {
            margin-top: auto;
            font-size: 12px;
            color: #9fb3c8;
            padding: 12px;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 240px;
            padding: 35px;
            max-width: 1600px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .topbar p {
            color: var(--muted);
            font-size: 14px;
        }

        .date {
            background: white;
            border: 1px solid var(--border);
            padding: 11px 15px;
            border-radius: 9px;
            font-size: 13px;
            color: var(--muted);
        }

        /* ================= CARDS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 23px;
            box-shadow: var(--shadow);
        }

        .card-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 29px;
            font-weight: bold;
        }

        .balance {
            background: var(--navy);
            color: white;
        }

        .balance .card-label {
            color: #bcccdc;
        }

        .income {
            color: var(--green);
        }

        .expense {
            color: var(--red);
        }

        /* ================= CONTENT GRID ================= */

        .content-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 25px;
        }

        .section {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 18px;
        }

        /* ================= TRANSACTION FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .input-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: var(--muted);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: white;
            color: var(--text);
        }

        input:focus,
        select:focus {
            border-color: var(--navy);
        }

        .add-btn {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: var(--navy);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
        }

        /* ================= BUDGET ================= */

        .budget-number {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .budget-number strong {
            font-size: 20px;
        }

        .budget-number span {
            color: var(--muted);
            font-size: 13px;
        }

        .progress {
            height: 10px;
            width: 100%;
            background: #e6edf3;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--navy);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .budget-input {
            margin-top: 18px;
        }

        .budget-btn {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: 1px solid var(--navy);
            background: white;
            color: var(--navy);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .budget-btn:hover {
            background: var(--navy);
            color: white;
        }

        /* ================= TRANSACTIONS ================= */

        .transactions {
            margin-top: 25px;
        }

        .transaction-tools {
            display: flex;
            gap: 10px;
        }

        .search {
            max-width: 220px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #edf1f5;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .transaction-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #eef3f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .transaction-name {
            font-weight: bold;
            font-size: 14px;
        }

        .transaction-category {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .amount-income {
            color: var(--green);
            font-weight: bold;
        }

        .amount-expense {
            color: var(--red);
            font-weight: bold;
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #9fb3c8;
            cursor: pointer;
            font-size: 16px;
        }

        .delete-btn:hover {
            color: var(--red);
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: var(--muted);
            font-size: 14px;
        }

        /* ================= CHART ================= */

        .chart {
            height: 180px;
            display: flex;
            align-items: end;
            justify-content: space-around;
            gap: 10px;
            padding-top: 20px;
        }

        .bar-container {
            height: 100%;
            display: flex;
            align-items: end;
            flex-direction: column;
            justify-content: end;
            width: 35px;
        }

        .bar {
            width: 100%;
            min-height: 4px;
            background: var(--navy);
            border-radius: 6px 6px 0 0;
            transition: height 0.4s;
        }

        .bar-label {
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                padding: 25px;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 750px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
            }

            .nav {
                flex-direction: row;
                overflow-x: auto;
            }

            .sidebar-bottom {
                display: none;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-group.full {
                grid-column: auto;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .transaction-tools {
                flex-direction: column;
            }

            .search {
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            Money<span>Flow</span>
        </div>

        <div class="nav">
            <button class="active">Dashboard</button>
            <button onclick="scrollToTransactions()">Transactions</button>
            <button onclick="scrollToBudget()">Budget</button>
        </div>

        <div class="sidebar-bottom">
            Personal Finance Dashboard
        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <div class="topbar">

            <div>
                <h1>Dashboard</h1>
                <p>Manage your money with confidence.</p>
            </div>

            <div class="date" id="currentDate"></div>

        </div>


        <!-- ================= STAT CARDS ================= -->

        <section class="stats">

            <div class="card balance">
                <div class="card-label">TOTAL BALANCE</div>
                <div class="card-value" id="balance">$0.00</div>
            </div>

            <div class="card">
                <div class="card-label">TOTAL INCOME</div>
                <div class="card-value income" id="income">$0.00</div>
            </div>

            <div class="card">
                <div class="card-label">TOTAL EXPENSES</div>
                <div class="card-value expense" id="expenses">$0.00</div>
            </div>

        </section>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="content-grid">

            <!-- ADD TRANSACTION -->

            <section class="section">

                <div class="section-header">
                    <h2>Add Transaction</h2>
                </div>

                <form id="transactionForm">

                    <div class="form-grid">

                        <div class="input-group">
                            <label>TYPE</label>

                            <select id="type">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>


                        <div class="input-group">
                            <label>AMOUNT</label>

                            <input
                                type="number"
                                id="amount"
                                placeholder="0.00"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>


                        <div class="input-group">
                            <label>DESCRIPTION</label>

                            <input
                                type="text"
                                id="description"
                                placeholder="e.g. Salary"
                                required
                            >
                        </div>


                        <div class="input-group">
                            <label>CATEGORY</label>

                            <select id="category">

                                <option value="Food">Food</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Transport">Transport</option>
                                <option value="Technology">Technology</option>
                                <option value="Education">Education</option>
                                <option value="Salary">Salary</option>
                                <option value="Other">Other</option>

                            </select>
                        </div>

                    </div>

                    <button class="add-btn" type="submit">
                        + Add Transaction
                    </button>

                </form>

            </section>


            <!-- BUDGET -->

            <section class="section" id="budgetSection">

                <div class="section-header">
                    <h2>Monthly Budget</h2>
                </div>

                <div class="budget-number">

                    <strong id="budgetSpent">$0</strong>

                    <span id="budgetTotal">
                        of $1,000
                    </span>

                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="budget-input">

                    <label>SET MONTHLY BUDGET</label>

                    <input
                        type="number"
                        id="budgetInput"
                        placeholder="1000"
                        min="0"
                    >

                    <button
                        class="budget-btn"
                        onclick="setBudget()"
                    >
                        Save Budget
                    </button>

                </div>

            </section>

        </div>


        <!-- ================= CHART ================= -->

        <section class="section" style="margin-top:25px;">

            <div class="section-header">
                <h2>Spending Overview</h2>
            </div>

            <div class="chart" id="chart"></div>

        </section>


        <!-- ================= TRANSACTIONS ================= -->

        <section class="section transactions" id="transactionsSection">

            <div class="section-header">

                <h2>Recent Transactions</h2>

                <div class="transaction-tools">

                    <input
                        class="search"
                        type="text"
                        id="search"
                        placeholder="Search..."
                        oninput="renderTransactions()"
                    >

                    <select
                        id="filter"
                        onchange="renderTransactions()"
                    >
                        <option value="all">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>

                </div>

            </div>

            <div id="transactionList"></div>

        </section>

    </main>


    <script>

        /* ==========================================
           MONEY TRACKER
           ========================================== */

        let transactions =
            JSON.parse(localStorage.getItem("transactions")) || [];

        let budget =
            Number(localStorage.getItem("budget")) || 1000;


        /* ==========================================
           DATE
           ========================================== */

        const dateElement =
            document.getElementById("currentDate");

        const today = new Date();

        dateElement.textContent =
            today.toLocaleDateString("en-US", {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            });


        /* ==========================================
           SAVE DATA
           ========================================== */

        function saveData() {

            localStorage.setItem(
                "transactions",
                JSON.stringify(transactions)
            );

            localStorage.setItem(
                "budget",
                budget
            );
        }


        /* ==========================================
           ADD TRANSACTION
           ========================================== */

        document
            .getElementById("transactionForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const type =
                    document.getElementById("type").value;

                const amount =
                    Number(document.getElementById("amount").value);

                const description =
                    document.getElementById("description").value.trim();

                const category =
                    document.getElementById("category").value;


                if (amount <= 0 || description === "") {
                    alert("Please enter valid information.");
                    return;
                }


                const transaction = {

                    id: Date.now(),

                    type: type,

                    amount: amount,

                    description: description,

                    category: category,

                    date: new Date().toLocaleDateString()

                };


                transactions.unshift(transaction);

                saveData();

                this.reset();

                updateDashboard();

            });


        /* ==========================================
           UPDATE DASHBOARD
           ========================================== */

        function updateDashboard() {

            let income = 0;

            let expenses = 0;


            transactions.forEach(function(transaction) {

                if (transaction.type === "income") {

                    income += transaction.amount;

                } else {

                    expenses += transaction.amount;

                }

            });


            const balance = income - expenses;


            document.getElementById("balance").textContent =
                formatMoney(balance);

            document.getElementById("income").textContent =
                formatMoney(income);

            document.getElementById("expenses").textContent =
                formatMoney(expenses);


            updateBudget(expenses);

            renderTransactions();

            renderChart();

        }


        /* ==========================================
           FORMAT MONEY
           ========================================== */

        function formatMoney(number) {

            return "$" + number.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        }


        /* ==========================================
           TRANSACTION ICON
           ========================================== */

        function getIcon(category) {

            const icons = {

                Food: "🍔",

                Shopping: "🛍️",

                Entertainment: "🎮",

                Transport: "🚗",

                Technology: "💻",

                Education: "📚",

                Salary: "💼",

                Other: "📌"

            };

            return icons[category] || "📌";

        }


        /* ==========================================
           RENDER TRANSACTIONS
           ========================================== */

        function renderTransactions() {

            const list =
                document.getElementById("transactionList");

            const search =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();

            const filter =
                document.getElementById("filter").value;


            let filtered =
                transactions.filter(function(transaction) {

                    const matchesSearch =
                        transaction.description
                            .toLowerCase()
                            .includes(search) ||
                        transaction.category
                            .toLowerCase()
                            .includes(search);

                    const matchesFilter =
                        filter === "all" ||
                        transaction.type === filter;

                    return matchesSearch && matchesFilter;

                });


            if (filtered.length === 0) {

                list.innerHTML = `
                    <div class="empty">
                        No transactions found.
                    </div>
                `;

                return;

            }


            list.innerHTML = filtered.map(function(transaction) {

                const amountClass =
                    transaction.type === "income"
                        ? "amount-income"
                        : "amount-expense";

                const sign =
                    transaction.type === "income"
                        ? "+"
                        : "-";


                return `

                    <div class="transaction">

                        <div class="transaction-left">

                            <div class="transaction-icon">
                                ${getIcon(transaction.category)}
                            </div>

                            <div>

                                <div class="transaction-name">
                                    ${escapeHTML(transaction.description)}
                                </div>

                                <div class="transaction-category">
                                    ${transaction.category}
                                    •
                                    ${transaction.date}
                                </div>

                            </div>

                        </div>


                        <div class="transaction-right">

                            <span class="${amountClass}">
                                ${sign}${formatMoney(transaction.amount)}
                            </span>

                            <button
                                class="delete-btn"
                                onclick="deleteTransaction(${transaction.id})"
                                title="Delete"
                            >
                                ✕
                            </button>

                        </div>

                    </div>

                `;

            }).join("");

        }


        /* ==========================================
           DELETE TRANSACTION
           ========================================== */

        function deleteTransaction(id) {

            transactions =
                transactions.filter(function(transaction) {

                    return transaction.id !== id;

                });


            saveData();

            updateDashboard();

        }


        /* ==========================================
           ESCAPE HTML
           ========================================== */

        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* ==========================================
           BUDGET
           ========================================== */

        function setBudget() {

            const value =
                Number(
                    document.getElementById("budgetInput").value
                );


            if (value <= 0) {

                alert("Enter a valid budget.");

                return;

            }


            budget = value;

            saveData();

            updateDashboard();

            document.getElementById("budgetInput").value = "";

        }


        function updateBudget(expenses) {

            document.getElementById("budgetSpent")
                .textContent = formatMoney(expenses);

            document.getElementById("budgetTotal")
                .textContent = "of " + formatMoney(budget);


            let percentage =
                (expenses / budget) * 100;


            if (percentage > 100) {

                percentage = 100;

            }


            document.getElementById("progressBar")
                .style.width = percentage + "%";

        }


        /* ==========================================
           CHART
           ========================================== */

        function renderChart() {

            const chart =
                document.getElementById("chart");


            const categories = {

                Food: 0,
                Shopping: 0,
                Entertainment: 0,
                Transport: 0,
                Technology: 0,
                Education: 0,
                Other: 0

            };


            transactions.forEach(function(transaction) {

                if (
                    transaction.type === "expense" &&
                    categories[transaction.category] !== undefined
                ) {

                    categories[transaction.category] +=
                        transaction.amount;

                }

            });


            const values =
                Object.values(categories);

            const max =
                Math.max(...values, 1);


            chart.innerHTML =
                Object.entries(categories)
                    .map(function([category, amount]) {

                        const height =
                            (amount / max) * 130;

                        return `

                            <div class="bar-container">

                                <div
                                    class="bar"
                                    style="height:${Math.max(height, 4)}px"
                                    title="${category}: ${formatMoney(amount)}"
                                ></div>

                                <div class="bar-label">
                                    ${category.substring(0, 7)}
                                </div>

                            </div>

                        `;

                    })
                    .join("");

        }


        /* ==========================================
           NAVIGATION
           ========================================== */

        function scrollToTransactions() {

            document
                .getElementById("transactionsSection")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


        function scrollToBudget() {

            document
                .getElementById("budgetSection")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


        /* ==========================================
           START APP
           ========================================== */

        updateDashboard();

    </script>

</body>
</html>
